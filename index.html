<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>發票轉報稅 Excel</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#fff;--fg:#1c1c1e;--mut:#6b6b70;--line:#ddd;--card:#f6f7f9;--pri:#1f5fa6;--ok:#2e7d32;--warn:#c62828;--m1:#ebf3fb;--m2:#ebf7ee}
@media(prefers-color-scheme:dark){:root{--bg:#1b1c1f;--fg:#ececee;--mut:#9a9aa0;--line:#3a3b40;--card:#26272b;--pri:#5b9bdc;--ok:#66bb6a;--warn:#ef5350;--m1:#1f2e3f;--m2:#1f3326}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 -apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--fg)}
main{max-width:1000px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:15px;margin:24px 0 8px}
p.s{color:var(--mut);margin:0 0 16px;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:2px}
input{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);font:inherit}
#drop{margin-top:16px;border:2px dashed var(--line);border-radius:10px;padding:32px 16px;text-align:center;cursor:pointer;color:var(--mut)}
#drop.over{border-color:var(--pri);background:var(--card)}
button{padding:8px 16px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit;cursor:pointer}
button.p{background:var(--pri);border-color:var(--pri);color:#fff}
button:disabled{opacity:.5;cursor:wait}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
#msg{font-size:13px;color:var(--mut)}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;margin-top:8px}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:820px}
th{background:var(--card);text-align:left;padding:7px 6px;font-weight:600;white-space:nowrap;border-bottom:1px solid var(--line)}
td{padding:3px 4px;border-bottom:1px solid var(--line)}
td input{padding:4px 5px;border-color:transparent;background:transparent}
td input:focus{border-color:var(--pri);background:var(--bg)}
tr.m1{background:var(--m1)}tr.m2{background:var(--m2)}
.tag{font-size:11px;padding:1px 6px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}
.w{color:var(--warn);font-size:12px}
.sum{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--mut)}
.sum b{color:var(--fg)}
details{margin-top:12px}summary{cursor:pointer;color:var(--mut);font-size:13px}
</style>
</head>
<body>
<main>
<h1>發票轉報稅 Excel</h1>
<p class="s">上傳電子發票照片，自動讀取發票左側 QR Code（免費、最準確），讀不到時可改用 Claude AI 辨識，並產出可匯入報稅軟體的 Excel。照片只在你的瀏覽器處理。</p>

<h2>固定設定（會記在這台裝置）</h2>
<div class="card"><div class="grid">
<div><label>格式代號</label><input id="c_fmt"></div>
<div><label>稅籍代號</label><input id="c_tax"></div>
<div><label>買受人統一編號</label><input id="c_buyer"></div>
<div><label>扣抵代號</label><input id="c_ded"></div>
<div><label>課稅別</label><input id="c_type"></div>
</div>
<details><summary>AI 備援設定（選填）：QR Code 讀不到時才會用到</summary>
<div style="margin-top:8px"><label>Anthropic API Key（只存在你的瀏覽器，不會上傳到 GitHub）</label><input id="c_key" type="password" placeholder="sk-ant-..." autocomplete="off"></div>
<div style="margin-top:8px"><label>模型</label><input id="c_model"></div>
</details></div>

<div id="drop">📷 點擊或拖曳發票照片到這裡（可多張）<input id="file" type="file" accept="image/*" multiple hidden></div>
<div class="bar"><button class="p" id="go" disabled>開始辨識</button><button id="clr">清除全部</button><span id="msg"></span></div>

<div id="res" hidden>
<h2>辨識結果（可直接修改，年月會依發票日期自動歸類）</h2>
<div class="wrap"><table><thead><tr><th>項次</th><th>年月</th><th>廠商統編</th><th>字軌</th><th>發票號碼</th><th>金額(未稅)</th><th>稅額</th><th>來源</th><th></th></tr></thead><tbody id="tb"></tbody></table></div>
<div class="sum" id="sum"></div>
<div class="bar"><button class="p" id="dl">⬇ 下載報稅 Excel</button><button id="add">+ 新增一列</button></div>
</div>
</main>

<script>
const $=s=>document.querySelector(s);
const DEF={c_fmt:'25',c_tax:'470104502',c_buyer:'16970164',c_ded:'1',c_type:'1',c_model:'claude-sonnet-5-5',c_key:''};
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
for(const k in DEF){const el=$('#'+k);el.value=ls.get(k)??DEF[k];el.addEventListener('change',()=>ls.set(k,el.value.trim()))}
const cfg=()=>Object.fromEntries(Object.keys(DEF).map(k=>[k,$('#'+k).value.trim()]));

let files=[],rows=[];

/* ---------- 上傳 ---------- */
$('#drop').onclick=()=>$('#file').click();
$('#drop').ondragover=e=>{e.preventDefault();$('#drop').classList.add('over')};
$('#drop').ondragleave=()=>$('#drop').classList.remove('over');
$('#drop').ondrop=e=>{e.preventDefault();$('#drop').classList.remove('over');addFiles(e.dataTransfer.files)};
$('#file').onchange=e=>{addFiles(e.target.files);e.target.value=''};
function addFiles(list){
  for(const f of list){if(f.type.startsWith('image/')&&!files.some(x=>x.name===f.name&&x.size===f.size))files.push(f)}
  $('#go').disabled=!files.length;
  $('#msg').textContent=files.length?`已選 ${files.length} 張照片`:'';
}
$('#clr').onclick=()=>{files=[];rows=[];$('#go').disabled=true;$('#msg').textContent='';$('#res').hidden=true;render()};

/* ---------- 讀取圖片 ---------- */
const loadImg=f=>new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=URL.createObjectURL(f)});

/* ---------- QR 辨識（電子發票左側 QR） ---------- */
const isInv=s=>/^[A-Z]{2}\d{15}.{4}[0-9a-fA-F]{16}\d{16}/.test(s);
function scanQR(img){
  for(const maxW of [1600,2400,900]){
    const sc=Math.min(1,maxW/Math.max(img.width,img.height));
    const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
    const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0,c.width,c.height);
    for(let i=0;i<3;i++){
      const d=x.getImageData(0,0,c.width,c.height);
      const r=jsQR(d.data,c.width,c.height,{inversionAttempts:'attemptBoth'});
      if(!r)break;
      if(isInv(r.data))return r.data;
      const L=r.location,xs=[L.topLeftCorner,L.topRightCorner,L.bottomLeftCorner,L.bottomRightCorner].map(p=>p.x),ys=[L.topLeftCorner,L.topRightCorner,L.bottomLeftCorner,L.bottomRightCorner].map(p=>p.y);
      x.fillStyle='#fff';x.fillRect(Math.min(...xs)-6,Math.min(...ys)-6,Math.max(...xs)-Math.min(...xs)+12,Math.max(...ys)-Math.min(...ys)+12);
    }
  }
  return null;
}
function parseQR(s){
  const y=+s.slice(10,13)+1911,m=s.slice(13,15),d=s.slice(15,17);
  const sales=parseInt(s.slice(21,29),16),total=parseInt(s.slice(29,37),16);
  return{track:s.slice(0,2),no:s.slice(2,10),date:`${y}-${m}-${d}`,ym:s.slice(10,13)+m,amt:sales,tax:total-sales,buyer:s.slice(37,45),seller:s.slice(45,53),src:'QR'};
}

/* ---------- AI 備援 ---------- */
async function aiRead(file){
  const {c_key,c_model}=cfg();
  if(!c_key)throw new Error('QR 讀不到，且未設定 API Key');
  const img=await loadImg(file),sc=Math.min(1,1600/Math.max(img.width,img.height));
  const c=document.createElement('canvas');c.width=img.width*sc;c.height=img.height*sc;c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  const b64=c.toDataURL('image/jpeg',.85).split(',')[1];
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':c_key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:c_model,max_tokens:500,messages:[{role:'user',content:[{type:'image',source:{type:'base64',media_type:'image/jpeg',data:b64}},
    {type:'text',text:'這是台灣電子發票證明聯。只回傳 JSON，不要其他文字：{"seller":"賣方統編8碼","buyer":"買方統編8碼","track":"字軌2碼英文","no":"字軌後8碼數字","date":"YYYY-MM-DD(發票開立日期)","amt":銷售額(未稅,數字),"tax":稅額(數字)}。看不清楚的欄位填空字串或0，不要猜。'}]}]})});
  if(!r.ok)throw new Error('AI 請求失敗 '+r.status);
  const t=(await r.json()).content.map(b=>b.text||'').join('').replace(/```json|```/g,'').trim();
  const j=JSON.parse(t),[Y,M]=(j.date||'').split('-');
  return{track:j.track,no:j.no,date:j.date,ym:Y?String(+Y-1911).padStart(3,'0')+M:'',amt:+j.amt||0,tax:+j.tax||0,buyer:j.buyer,seller:j.seller,src:'AI'};
}

/* ---------- 主流程 ---------- */
$('#go').onclick=async()=>{
  $('#go').disabled=true;let n=0,fail=[];
  for(const f of files){
    $('#msg').textContent=`辨識中 ${++n}/${files.length}…`;
    try{
      const img=await loadImg(f),q=scanQR(img);
      rows.push({...(q?parseQR(q):await aiRead(f)),file:f.name});
    }catch(e){fail.push(f.name+'（'+e.message+'）')}
  }
  files=[];$('#msg').textContent=fail.length?`完成，${fail.length} 張失敗：`+fail.join('、'):`完成，共 ${rows.length} 筆`;
  render();
};

/* ---------- 表格 ---------- */
const sorted=()=>[...rows].sort((a,b)=>(a.ym+a.date).localeCompare(b.ym+b.date));
function warns(r,dupes){
  const w=[],{c_buyer}=cfg();
  if(!/^\d{8}$/.test(r.seller||''))w.push('統編需 8 碼');
  if(!/^[A-Z]{2}$/.test(r.track||''))w.push('字軌需 2 碼英文');
  if(!/^\d{8}$/.test(r.no||''))w.push('號碼需 8 碼');
  if(!/^\d{5}$/.test(r.ym||''))w.push('年月格式');
  if(r.buyer&&r.buyer!==c_buyer)w.push('買方統編不符');
  if(dupes[r.track+r.no]>1)w.push('發票重複');
  if(r.amt&&Math.abs(r.tax-r.amt*.05)>1.5)w.push('稅額≠5%');
  return w.join('、');
}
function render(){
  const list=sorted(),months=[...new Set(list.map(r=>r.ym))],dupes={};
  list.forEach(r=>dupes[r.track+r.no]=(dupes[r.track+r.no]||0)+1);
  $('#res').hidden=!rows.length;
  $('#tb').innerHTML=list.map((r,i)=>`<tr class="${months.indexOf(r.ym)%2?'m2':'m1'}" data-i="${rows.indexOf(r)}">
    <td>${String(i+1).padStart(7,'0')}</td>
    ${['ym','seller','track','no','amt','tax'].map(k=>`<td><input data-k="${k}" value="${r[k]??''}" style="width:${k=='track'?44:k=='amt'||k=='tax'?72:92}px"></td>`).join('')}
    <td><span class="tag">${r.src}</span> <span class="w">${warns(r,dupes)}</span></td><td><button data-del>✕</button></td></tr>`).join('');
  const A=rows.reduce((s,r)=>s+(+r.amt||0),0),T=rows.reduce((s,r)=>s+(+r.tax||0),0);
  $('#sum').innerHTML=`<span>共 <b>${rows.length}</b> 張</span><span>未稅合計 <b>${A.toLocaleString()}</b></span><span>稅額合計 <b>${T.toLocaleString()}</b></span>`;
}
$('#tb').addEventListener('change',e=>{
  const tr=e.target.closest('tr'),k=e.target.dataset.k;if(!k)return;
  const r=rows[+tr.dataset.i];r[k]=['amt','tax'].includes(k)?(+e.target.value||0):e.target.value.trim().toUpperCase();render();
});
$('#tb').addEventListener('click',e=>{if(e.target.dataset.del!==undefined){rows.splice(+e.target.closest('tr').dataset.i,1);render()}});
$('#add').onclick=()=>{rows.push({track:'',no:'',date:'9999',ym:(sorted().pop()||{}).ym||'',amt:0,tax:0,buyer:'',seller:'',src:'手動'});render()};

/* ---------- 匯出 Excel（欄位順序固定） ---------- */
$('#dl').onclick=()=>{
  const c=cfg(),list=sorted();
  const head=['格式代號','稅籍代號','項次','年月','買受人統一編號','廠商統一編號','字軌','發票號碼','金額','扣抵代號','稅額','課稅別'];
  const data=list.map((r,i)=>[c.c_fmt,c.c_tax,String(i+1).padStart(7,'0'),r.ym,c.c_buyer,r.seller,r.track,r.no,+r.amt||0,c.c_ded,+r.tax||0,c.c_type]);
  const ws=XLSX.utils.aoa_to_sheet([head,...data]);
  ws['!cols']=[8,13,9,8,14,13,6,12,10,8,8,8].map(w=>({wch:w}));
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'進項發票');
  const ms=[...new Set(list.map(r=>r.ym))];
  XLSX.writeFile(wb,`進項發票_${ms.join('_')||'empty'}.xlsx`);
};
</script>
</body>
</html>
